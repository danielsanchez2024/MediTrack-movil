name: Build APK (manual)

# Prepared but not wired to any release: runs only when triggered by hand from the Actions tab
# and leaves the APK as a downloadable workflow artifact (kept 14 days). Nothing is published.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        options: [debug, release]
        default: debug
      api_base_url:
        description: "API base URL baked into the app (e.g. https://your-domain.com/api/v1)"
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build APK
        run: |
          DEFINES=""
          if [ -n "${{ inputs.api_base_url }}" ]; then DEFINES="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"; fi
          flutter build apk --${{ inputs.mode }} $DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: meditrack-${{ inputs.mode }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.mode }}.apk
          retention-days: 14
